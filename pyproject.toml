[project]
name = "track01-student-kit"
version = "1.0.0"
description = "Track 01 Google Maps for Every Building: starter agent and scorer"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi",
    "httpx>=0.28,<1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "python-multipart",
    "shapely>=2.2.0",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starter_agent", "benchmark", "agent", "core"]
